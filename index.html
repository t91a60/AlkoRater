<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="AlkoRater - aplikacja do oceniania alkoholi. Offline-first PWA z iOS feel.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://dummyimage.com; font-src 'self'; connect-src 'self';">
    <title>Alko Rater</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header glass">
            <div class="header-main">
                <div class="nav-logo">
                    <img src="logo.png" alt="Alko Rater" class="app-logo" width="32" height="32">
                    <h1 id="headerTitle">Start</h1>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Tab: Start -->
            <section id="tab-start" class="tab-view active">
                <div class="large-title-spacer"></div>

                <div class="section-container">
                    <div id="dashboardGrid" class="dashboard-grid"></div>
                </div>

                <div class="section-container">
                    <h3 class="section-title">Ostatnio Ocenione</h3>
                    <div id="recentlyRated" class="recent-scroll"></div>
                </div>

                <div class="info-block glass">
                    <p>Baza offline: <span id="dbCount">0</span> produktów</p>
                </div>
            </section>

            <!-- Tab: Search -->
            <section id="tab-search" class="tab-view">
                <div class="large-title-spacer"></div>

                <div class="search-bar-container glass-sticky">
                    <div class="search-wrapper">
                        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Szukaj (np. wódka)..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                        <button id="clearSearch" class="clear-btn" aria-label="Wyczyść wyszukiwanie">✕</button>
                    </div>
                </div>

                <div id="searchSkeletons" class="skeletons-container" style="display:none"></div>
                <div id="searchResults" class="results-list"></div>

                <div id="noResults" class="empty-state-animated" style="display: none;">
                    <div class="floating-ghost">
                        <svg class="ghost-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"></path>
                            <circle cx="9" cy="10" r="1.2" fill="currentColor"></circle>
                            <circle cx="15" cy="10" r="1.2" fill="currentColor"></circle>
                        </svg>
                    </div>
                    <p style="opacity: 0.6; font-weight: 500;">Nie znaleziono w naszej bazie danych.</p>
                </div>
            </section>

            <!-- Tab: Favorites -->
            <section id="tab-favorites" class="tab-view">
                <div class="large-title-spacer"></div>

                <div class="filters-container">
                    <button class="filter-chip active" data-filter="wszystkie">Wszystkie</button>
                    <button class="filter-chip" data-filter="piwo">Piwo</button>
                    <button class="filter-chip" data-filter="wódka">Wódka</button>
                    <button class="filter-chip" data-filter="wino">Wino</button>
                </div>

                <div class="backup-actions glass">
                    <button id="btnExport" class="backup-btn">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        Eksportuj
                    </button>
                    <button id="btnImport" class="backup-btn">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Importuj
                    </button>
                    <input type="file" id="fileImport" accept=".json" style="display:none">
                </div>

                <div id="favoritesList" class="results-list"></div>
            </section>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav glass">
            <button class="nav-item active" data-tab="start" aria-label="Start">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <span class="nav-label">Start</span>
            </button>
            <button class="nav-item" data-tab="search" aria-label="Szukaj">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <span class="nav-label">Szukaj</span>
            </button>
            <button class="nav-item" data-tab="favorites" aria-label="Ulubione">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </div>
                <span class="nav-label">Ulubione</span>
            </button>
        </nav>

        <!-- Modal -->
        <div id="modal-wrapper" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1" style="display: none;">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-grabber"></div>
                <button id="modalClose" class="close-btn-right" aria-label="Zamknij">✕</button>
                <button id="modalShare" class="share-btn-left" aria-label="Udostępnij">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                </button>
                <h3 id="modalTitle" class="modal-title">Nazwa Produktu</h3>
                <div id="modalCategoryTag" class="category-badge">Kategoria: ...</div>
                <div class="stars-container">
                    <div class="star" data-value="1" role="button" aria-label="1 gwiazdka">★</div>
                    <div class="star" data-value="2" role="button" aria-label="2 gwiazdki">★</div>
                    <div class="star" data-value="3" role="button" aria-label="3 gwiazdki">★</div>
                    <div class="star" data-value="4" role="button" aria-label="4 gwiazdki">★</div>
                    <div class="star" data-value="5" role="button" aria-label="5 gwiazdek">★</div>
                </div>
                <label class="note-label" for="noteInput">Twoja notatka (opcjonalnie)</label>
                <textarea id="noteInput" placeholder="Napisz coś..." rows="4"></textarea>
                <button id="saveButton" class="btn-primary" disabled>Zapisz Ocenę</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/js/main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('[SW] Registered:', reg.scope))
                    .catch(err => console.error('[SW] Registration failed:', err));
            });
        }
    </script>
</body>
</html>
