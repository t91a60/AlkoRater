<!DOCTYPE html>
<html lang="pl" itemscope itemtype="https://schema.org/WebApplication">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="AlkoRater — Progressive Web App do oceniania alkoholi. Offline-first, mobile-first. Śledź i oceniaj piwo, wódkę i wino bez internetu.">
    <meta name="robots" content="index, follow">
    <meta name="application-name" content="AlkoRater">
    <meta name="google" content="notranslate">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self';">

    <!-- Open Graph -->
    <meta property="og:title" content="AlkoRater — Offline-first PWA do oceniania alkoholi">
    <meta property="og:description" content="Progressive Web App do oceniania alkoholi. Offline-first, mobile-first. Śledź i oceniaj piwo, wódkę i wino bez internetu.">
    <meta property="og:url" content="https://t91a60.github.io/AlkoRater/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AlkoRater">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AlkoRater — Offline-first PWA do oceniania alkoholi">
    <meta name="twitter:description" content="Progressive Web App do oceniania alkoholi. Offline-first, mobile-first. Śledź i oceniaj piwo, wódkę i wino bez internetu.">
    <meta name="twitter:image" content="https://t91a60.github.io/AlkoRater/logo.png">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AlkoRater",
        "url": "https://t91a60.github.io/AlkoRater/",
        "description": "Offline-first Progressive Web App do oceniania i śledzenia alkoholi."
    }
    </script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "AlkoRater",
        "description": "Progressive Web App do oceniania alkoholi. Offline-first, mobile-first.",
        "url": "https://t91a60.github.io/AlkoRater/",
        "isPartOf": {
            "@type": "WebSite",
            "name": "AlkoRater",
            "url": "https://t91a60.github.io/AlkoRater/"
        }
    }
    </script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "AlkoRater",
        "operatingSystem": "Web",
        "description": "Offline-first Progressive Web App for tracking and rating alcohol consumption. Works entirely offline.",
        "applicationCategory": "Multimedia",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "PLN"
        },
        "author": {
            "@type": "Person",
            "name": "t91a60",
            "url": "https://github.com/t91a60"
        }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header glass">
            <div class="header-main">
                <div class="nav-logo">
                    <img src="logo.png" alt="AlkoRater" class="app-logo" width="32" height="32">
                    <h1 id="headerTitle">Start</h1>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <main class="content-area">
            <!-- Tab: Start -->
            <section id="tab-start" class="tab-view active">
                <div class="large-title-spacer"></div>

                <div class="tab-flex-content">
                    <div id="dashboardGrid" class="dashboard-wrapper"></div>

                    <div class="section-container">
                        <div class="section-header-flex">
                            <h2 class="section-title section-title--flush">Ostatnio Ocenione</h2>
                            <button id="showAllFavoritesBtn" class="link-btn">Wszystkie ></button>
                        </div>
                        <div id="recentlyRated" class="recent-scroll recent-scroll--spaced"></div>
                    </div>
                </div>

                <div class="info-block glass">
                    <p>Baza offline: <span id="dbCount">0</span> produktów</p>
                </div>
            </section>

            <!-- Tab: Search -->
            <section id="tab-search" class="tab-view">
                <div class="large-title-spacer"></div>

                <div class="search-bar-container glass-sticky">
                    <div class="search-wrapper">
                        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="search-input" placeholder="Szukaj (np. wódka)..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                        <label for="search-input" class="sr-only">Szukaj alkoholu</label>
                        <button id="clearSearch" class="clear-btn" aria-label="Wyczyść wyszukiwanie"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
                    </div>
                </div>

                <div id="searchSkeletons" class="skeletons-container" style="display:none"></div>
                <div id="searchResults" class="results-list"></div>

                <div id="noResults" class="empty-state-animated" style="display: none;">
                    <div class="floating-ghost">
                        <svg class="ghost-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"></path>
                            <circle cx="9" cy="10" r="1.2" fill="currentColor"></circle>
                            <circle cx="15" cy="10" r="1.2" fill="currentColor"></circle>
                        </svg>
                    </div>
                    <p class="empty-state-text">Nie znaleziono w naszej bazie danych.</p>
                </div>
            </section>

            <!-- Tab: Favorites -->
            <section id="tab-favorites" class="tab-view">
                <div class="large-title-spacer"></div>

                <div class="filters-container">
                    <button class="filter-chip active" data-filter="wszystkie">Wszystkie</button>
                    <button class="filter-chip" data-filter="piwo">Piwo</button>
                    <button class="filter-chip" data-filter="wódka">Wódka</button>
                    <button class="filter-chip" data-filter="wino">Wino</button>
                </div>



                <div id="favorites-list" class="results-list"></div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav glass" role="navigation" aria-label="Nawigacja">
            <button class="nav-item active" data-tab="start" aria-label="Start">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <span class="nav-label">Start</span>
            </button>
            <button class="nav-item" data-tab="search" aria-label="Szukaj">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <span class="nav-label">Szukaj</span>
            </button>
            <button class="nav-item" data-tab="favorites" aria-label="Ulubione">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </div>
                <span class="nav-label">Ulubione</span>
            </button>
        </nav>

        <!-- Update Banner -->
        <div id="update-banner" class="update-banner" role="status" aria-live="polite" style="display:none;">
            <div class="update-banner-inner">
                <svg class="update-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 .49-3.27"></path>
                </svg>
                <span class="update-text">Nowa wersja dostępna</span>
                <button id="update-btn" class="update-btn">Aktualizuj</button>
                <button id="update-dismiss" class="update-dismiss" aria-label="Zamknij"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
            </div>
        </div>

        <!-- Modal -->
        <div id="modal-wrapper" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1" style="display: none;">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-grabber"></div>
                <button id="modalClose" class="close-btn-right" aria-label="Zamknij"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5l-10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
                <h3 id="modalTitle" class="modal-title">Nazwa Produktu</h3>
                <div id="modalCategoryTag" class="category-badge">Kategoria: ...</div>
                <div class="stars-container" id="starsContainer">
                    <button type="button" class="star" data-value="1" aria-label="1 gwiazdka">★</button>
                    <button type="button" class="star" data-value="2" aria-label="2 gwiazdki">★</button>
                    <button type="button" class="star" data-value="3" aria-label="3 gwiazdki">★</button>
                    <button type="button" class="star" data-value="4" aria-label="4 gwiazdki">★</button>
                    <button type="button" class="star" data-value="5" aria-label="5 gwiazdek">★</button>
                </div>
                <label class="note-label" for="note-input">Twoja notatka (opcjonalnie)</label>
                <textarea id="note-input" placeholder="Napisz coś..." rows="4"></textarea>
                <button id="saveButton" class="btn-primary" disabled>Zapisz Ocenę</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/js/main.js"></script>
</body>
</html>
